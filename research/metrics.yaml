# Metric definitions. `engagement` metrics describe a benchmark (popularity); `evaluation`
# metrics describe a run's results. State the denominator: it is what makes scores comparable.

# ---- engagement (dated snapshots, collected by adapters)
- id: github_stars
  scope: engagement
  name: GitHub stars
  unit: count
  direction: neutral
  description: Stars on the benchmark's primary repository at the time of observation.
- id: github_forks
  scope: engagement
  name: GitHub forks
  unit: count
  direction: neutral
- id: paper_citations
  scope: engagement
  name: Paper citations
  unit: count
  direction: neutral
  description: Citations of the primary paper as counted by the named source (OpenAlex or Semantic Scholar).
- id: hf_downloads_30d
  scope: engagement
  name: Hugging Face downloads (30 days)
  unit: count
  direction: neutral

# ---- evaluation
- id: pass_rate
  scope: evaluation
  name: Pass rate
  unit: percent
  direction: higher_is_better
  aggregation: Passing attempts divided by the denominator, across all tasks and repetitions.
  denominator: Planned attempts. Each run must state how missing or incomplete attempts were counted.
- id: pass_hat_k
  scope: evaluation
  name: pass^k
  unit: percent
  direction: higher_is_better
  aggregation: Share of tasks where all k independent trials succeed.
  denominator: Tasks. k is recorded in the run's repetitions.
- id: accuracy
  scope: evaluation
  name: Accuracy
  unit: percent
  direction: higher_is_better
  denominator: Questions in the split.
